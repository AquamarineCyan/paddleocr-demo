name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cpu:
    name: Build CPU
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller main.spec

      - name: Archive CPU
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/output/*, test.png `
            -DestinationPath paddleocr-cpu-${{ github.ref_name }}.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: paddleocr-cpu
          path: paddleocr-cpu-${{ github.ref_name }}.zip

  build-gpu:
    name: Build GPU
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements-gpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gpu.txt

      - name: Build EXE
        run: pyinstaller main-gpu.spec

      - name: Archive GPU
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/output/*, test.png `
            -DestinationPath paddleocr-gpu-${{ github.ref_name }}.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: paddleocr-gpu
          path: paddleocr-gpu-${{ github.ref_name }}.zip

  release:
    name: Release
    runs-on: windows-latest
    needs: [build-cpu, build-gpu]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Check files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            paddleocr-cpu/paddleocr-cpu-${{ github.ref_name }}.zip
            paddleocr-gpu/paddleocr-gpu-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
