name: Build and Package

on:
  workflow_dispatch: 

jobs:
  build-cpu:
    name: Build CPU
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller main.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: paddleocr
          path: |
              dist/output/
              test.png

  build-gpu:
    name: Build GPU
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements-gpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gpu.txt

      - name: Build EXE
        run: pyinstaller main-gpu.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: paddleocr-gpu
          path: |
              dist/output/
              test.png
