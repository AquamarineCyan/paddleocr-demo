name: Build and Package

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        variant: ["cpu", "gpu"]

    name: Build (${{ matrix.variant }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: |
            ${{ matrix.variant == 'cpu' && 'requirements.txt' || 'requirements-gpu.txt' }}
  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ("${{ matrix.variant }}" -eq "cpu") {
              pip install -r requirements.txt
          } else {
              pip install -r requirements-gpu.txt
          }
  
      - name: Build EXE
        shell: pwsh
        run: |
          $args = "--file main.py"
          if ("${{ matrix.variant }}" -eq "gpu") {
              $args += " --nvidia"
          }
          Write-Host "Running: python package.py $args"
          python package.py $args
  
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddleocr-${{ matrix.variant }}
          path: dist/
          retention-days: 7
